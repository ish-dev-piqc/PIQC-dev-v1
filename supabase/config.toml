[auth]
# Default URL referenced in email templates and as the post-auth redirect
# fallback. The app overrides this per-call via emailRedirectTo, so this is
# just the display/fallback. Update to the Hostinger production URL when ready.
site_url = "http://localhost:5173/PIQC-dev-v1/"
# Allowlist of URLs Supabase will redirect to after auth. Wildcards required
# because the app runs at a /PIQC-dev-v1/ base path. Add the Hostinger URL
# here when production goes live.
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://ish-dev-piqc.github.io/**",
]
# Self-signup is allowed (anyone with the URL can create an account).
enable_signup = true
# Merge users with the same email across sign-in methods (magic link +
# email/password). Belt-and-suspenders for our magic-link-first flow.
enable_manual_linking = true

[auth.email]
# How long the same recipient must wait between auth emails (magic link,
# confirmation, etc.). Matches the client-side 30s Resend cooldown comfortably
# and prevents the same email from being spammed.
max_frequency = "1m0s"
# 8-digit one-time codes (used in confirmation emails, not magic-link URLs).
# Matches the prior remote setting.
otp_length = 8

[auth.email.template.magic_link]
subject = "Your PIQClinical sign-in link"
content_path = "./supabase/templates/magic_link.html"

[functions.dashboard-chat]
verify_jwt = false

[functions.chat]
verify_jwt = false

[functions.ingest]
verify_jwt = false

# Per-document poll driver. Called by the frontend on a timer while a
# document is in status='pending'. Asks Reducto for job status and runs
# processIngestCompletion when Reducto reports Completed. Authenticated.
[functions.ingest-status]
verify_jwt = true

# Stuck-pending safety net — called from authenticated dashboard mount, and
# (service-role mode) from the pg_cron recover schedule. Scans documents pending
# >10min and processes any that Reducto reports complete. Authenticated.
[functions.ingest-recover]
verify_jwt = true

# Reducto direct-webhook finalizer (workstream D). Reducto POSTs completed jobs
# here server-to-server, so finalization doesn't depend on the browser. Reducto
# can't mint a Supabase JWT, so this is unverified at the gateway and instead
# checks the REDUCTO_WEBHOOK_SECRET passed as ?token= on the registered URL.
[functions.reducto-webhook]
verify_jwt = false
