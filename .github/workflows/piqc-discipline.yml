name: PIQC Discipline

on:
  pull_request:
    branches: [main]

jobs:
  mechanical-checks:
    if: ${{ !startsWith(github.head_ref, 'archive/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cross-mode imports (site/audit/sotr don't import from each other)
        # SOTR exposes a curated public surface (presentational widgets +
        # types) that audit and site legitimately render inline — Stage 6
        # of the audit workflow, and the Protocol tab's schedule-of-events
        # table. Those imports are listed in ALLOWED_CROSS_MODE and skipped
        # by the check. Any other cross-mode import still fails.
        # When adding a new public SOTR widget, append it here AND document
        # it in plans/ishika/cross-mode-sotr-exemption.md's _archive entry.
        run: |
          set -u
          ALLOWED_CROSS_MODE='(/sotr/(WorksheetItemsList|WorksheetItemRow|SourceTruthDrawer|SourceTruthListDrawer|sourceEvidenceApi)|/types/sotr)'
          fail=0
          for domain in audit site sotr; do
            others=$(echo "audit site sotr" | tr ' ' '\n' | grep -v "^${domain}$" | tr '\n' '|' | sed 's/|$//')
            for base in src/lib src/components/dashboard src/types; do
              dir="${base}/${domain}"
              [ -d "$dir" ] || continue
              hits=$(grep -rnE "from ['\"][^'\"]*\b(${others})\b[^'\"]*['\"]" "$dir" 2>/dev/null \
                     | grep -vE "$ALLOWED_CROSS_MODE" || true)
              if [ -n "$hits" ]; then
                echo "::error::Cross-mode import in ${dir}"
                echo "$hits"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Raw Tailwind color classes (use text-fg-*)
        run: |
          set -u
          hits=$(grep -rnE "\btext-(gray|slate|zinc|neutral)-[0-9]" src --include="*.tsx" --include="*.ts" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw Tailwind color classes found. Use text-fg-heading / text-fg-body / text-fg-sub / text-fg-muted / text-fg-label instead."
            echo "$hits"
            exit 1
          fi

      - name: Components must not import supabase directly
        # Three exemption layers:
        #   1. Type-only imports — `import type {...}` is erased at compile time,
        #      makes no fetches, and isn't what this rule targets.
        #   2. src/components/auth/** — auth UI's coupling to supabase.auth.* is
        #      intrinsic; there is no Api wrapper that meaningfully abstracts
        #      `signInWithPassword` etc.
        #   3. KNOWN_COMPONENT_SUPABASE_DEBT — four files that import supabase
        #      or stream helpers from lib/supabase today. Each has a planned
        #      refactor (see plans/ishika/discipline-workflow-baseline.md
        #      Follow-ups). Adding a NEW file with this pattern still fails.
        run: |
          set -u
          KNOWN_COMPONENT_SUPABASE_DEBT='(^src/components/Chatbot\.tsx|^src/components/dashboard/(Dashboard|DashboardChat|KnowledgeBase)\.tsx)'
          hits=$(grep -rnE "from ['\"](@supabase/supabase-js|[^'\"]*lib/supabase)['\"]" src/components 2>/dev/null \
                 | grep -vE "import\s+type\b" \
                 | grep -vE "^src/components/auth/" \
                 | grep -vE "$KNOWN_COMPONENT_SUPABASE_DEBT" || true)
          if [ -n "$hits" ]; then
            echo "::error::Components must not import supabase. Move the fetch into the context layer (src/context/) or an Api file (src/lib/<domain>/<name>Api.ts)."
            echo "$hits"
            exit 1
          fi

      - name: Adapters must be pure (no supabase import)
        run: |
          set -u
          adapters=$(find src/lib -type f -name "*Adapter.ts" 2>/dev/null || true)
          fail=0
          for f in $adapters; do
            if grep -qE "from ['\"][^'\"]*supabase[^'\"]*['\"]" "$f"; then
              echo "::error file=${f}::Adapter imports supabase. Adapters must be pure mappers — move the fetch into the matching Api file."
              fail=1
            fi
          done
          exit $fail

      - name: Realtime subscriptions belong in context layer
        run: |
          set -u
          hits=$(grep -rnE "\.channel\(|\.on\(['\"]postgres_changes" src/components 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Realtime subscriptions must live in src/context/, not src/components/."
            echo "$hits"
            exit 1
          fi

      - name: Forbid `any` types in src/lib
        # `as any` is allowed in test mocks (e.g. mocking the Supabase client's
        # complex storage type); production code should always have a real
        # type. Restrict the rule to non-test files, and skip comment lines so
        # English prose like "any sessionStorage read failure" in a `// ...`
        # comment doesn't trip the regex.
        run: |
          set -u
          hits=$(grep -rnE "(:\s*any\b|\bas\s+any\b)" src/lib --include="*.ts" --include="*.tsx" 2>/dev/null \
                 | grep -vE "(/__tests__/|\.test\.)" \
                 | grep -vE ":[0-9]+:\s*(//|\*)" || true)
          if [ -n "$hits" ]; then
            echo "::error::': any' / 'as any' are not allowed in src/lib/** (non-test). Use proper types or Result<T>."
            echo "$hits"
            exit 1
          fi

      - name: Migrations are append-only
        run: |
          set -u
          base="origin/main"
          modified=$(git diff "${base}...HEAD" --diff-filter=M --name-only -- 'supabase/migrations/*.sql' 2>/dev/null || true)
          if [ -n "$modified" ]; then
            echo "::error::Migrations were modified, not added. Migrations must be append-only — create a new migration file instead."
            echo "$modified"
            exit 1
          fi

      - name: DB schema change should update TS type mirror
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          base="origin/main"
          sql_changed=$(git diff "${base}...HEAD" --name-only -- 'supabase/migrations/' 2>/dev/null | grep '\.sql$' || true)
          types_changed=$(git diff "${base}...HEAD" --name-only -- 'src/types/' 2>/dev/null || true)
          if [ -n "$sql_changed" ] && [ -z "$types_changed" ]; then
            if ! printf '%s' "$PR_BODY" | grep -qi "no type impact"; then
              echo "::warning::Migration changed but src/types/ was not updated. If this is intentional, add 'no type impact' to the PR description."
              echo "$sql_changed"
            fi
          fi

      - name: No console.log in non-test code
        run: |
          set -u
          base="origin/main"
          hits=$(git diff "${base}...HEAD" --unified=0 -- 'src/**/*.ts' 'src/**/*.tsx' \
            | grep -E "^\+" \
            | grep -vE "^\+\+\+" \
            | grep -vE "__tests__|\.test\." \
            | grep -E "console\.(log|debug)" || true)
          if [ -n "$hits" ]; then
            echo "::error::console.log/console.debug found in added lines. Remove before merging."
            echo "$hits"
            exit 1
          fi

      - name: No vitest timestamp litter at repo root
        run: |
          set -u
          if ls vitest.config.ts.timestamp-*.mjs >/dev/null 2>&1; then
            echo "::error::vitest.config.ts.timestamp-*.mjs files at repo root must be removed and gitignored."
            ls vitest.config.ts.timestamp-*.mjs
            exit 1
          fi

      - name: New API/adapter files have tests
        run: |
          set -u
          base="origin/main"
          new_files=$(git diff "${base}...HEAD" --diff-filter=A --name-only \
            -- 'src/lib/*/*Api.ts' 'src/lib/*/*Adapter.ts' 2>/dev/null || true)
          fail=0
          for f in $new_files; do
            dir=$(dirname "$f")
            name=$(basename "$f" .ts)
            test_file="${dir}/__tests__/${name}.test.ts"
            if [ ! -f "$test_file" ]; then
              echo "::error file=${f}::New API/adapter file has no sibling test at ${test_file}"
              fail=1
            fi
          done
          exit $fail

      - name: Plan MD referenced in PR body
        # IMPORTANT: pass the PR body via env, not via `${{ }}` interpolation
        # directly into the script. Inline interpolation lets backticks /
        # $(...) / etc. in the PR body get executed as shell commands —
        # observed on PR #85 where markdown code spans in the body caused
        # "command not found" cascades. Env-var pattern mirrors the
        # "DB schema → type mirror" step above.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          if ! printf '%s' "$PR_BODY" | grep -qE "plans/[a-z0-9_-]+/[a-z0-9_.-]+\.md"; then
            echo "::error::PR body must reference a plan MD (e.g. plans/ishika/draft-comments.md). See .github/pull_request_template.md."
            exit 1
          fi
